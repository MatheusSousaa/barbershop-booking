# ============================================================
# Configurações gerais da aplicação
# ============================================================
spring.application.name=barbershop
server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# -------------------------------------------------------
# Banco de dados
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbershop}
spring.datasource.username=${DB_USERNAME:barbershop}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------
# Flyway
# -------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Diretório persistente de fotos de serviços (pode ser sobrescrito com BARBERSHOP_UPLOAD_DIR).
barbershop.upload.directory=${BARBERSHOP_UPLOAD_DIR:${RAILWAY_VOLUME_MOUNT_PATH:./uploads}}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# -------------------------------------------------------
# Regras de Negócio e Agendamento
# -------------------------------------------------------
# Duração de cada slot em minutos
barbershop.slot.duration-minutes=30

# Fuso horário oficial da barbearia para validações de data e hora
barbershop.timezone=America/Bahia

# -------------------------------------------------------
# JWT e Segurança
# A chave de assinatura deve ser fornecida pelo ambiente.
# -------------------------------------------------------
barbershop.jwt.secret=${JWT_SECRET:}
barbershop.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Barbeiro Inicial (credenciais criadas no primeiro startup)
barbershop.initial-barber.username=${BARBER_INITIAL_USERNAME:}
barbershop.initial-barber.email=${BARBER_INITIAL_EMAIL:}
barbershop.initial-barber.password=${BARBER_INITIAL_PASSWORD:}
barbershop.initial-barber.display-name=${BARBER_INITIAL_NAME:Barbeiro de demonstração}

# CORS
barbershop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500}

# -------------------------------------------------------
# Springdoc / Swagger
# -------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
