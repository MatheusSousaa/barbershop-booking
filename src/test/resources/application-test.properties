spring.datasource.url=jdbc:postgresql://localhost:5432/barbershop_test
spring.datasource.username=barbershop
spring.datasource.password=barbershop
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

barbershop.slot.duration-minutes=30
barbershop.timezone=America/Bahia
barbershop.jwt.secret=test-secret-key-test-secret-key-test-secret-key-12345
barbershop.jwt.expiration-ms=3600000
barbershop.upload.directory=target/test-uploads
