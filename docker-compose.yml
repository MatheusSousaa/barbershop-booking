services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-barbershop}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      TZ: America/Bahia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-barbershop}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      BARBER_INITIAL_USERNAME: ${BARBER_INITIAL_USERNAME:?Defina BARBER_INITIAL_USERNAME no .env}
      BARBER_INITIAL_EMAIL: ${BARBER_INITIAL_EMAIL:?Defina BARBER_INITIAL_EMAIL no .env}
      BARBER_INITIAL_PASSWORD: ${BARBER_INITIAL_PASSWORD:?Defina BARBER_INITIAL_PASSWORD no .env}
      BARBER_INITIAL_NAME: ${BARBER_INITIAL_NAME:-Barbeiro}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_RECIPIENT: ${SMTP_RECIPIENT:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      BARBERSHOP_UPLOAD_DIR: /app/uploads
      TZ: America/Bahia
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - service_photos:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  service_photos:
